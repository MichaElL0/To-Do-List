<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>To do List</title>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>To-Do or not</h1>
        </header>

        <nav class="sidebar">
            <ul class="filter-list">
                <li class="filter-item"><button type="button" data-filter="all" class="active"><img src="./images/calendar-month.svg" alt="All icon">All</button></li>
                <li class="filter-item"><button type="button" data-filter="today"><img src="./images/calendar-today.svg" alt="Today icon">Today</button></li>
                <li class="filter-item"><button type="button" data-filter="week"><img src="./images/calendar-week.svg" alt="Week icon">Week</button></li>
                <li class="filter-item"><button type="button" data-filter="important"><img src="./images/calendar-star.svg" alt="Important icon">Important</button></li>
                <li class="filter-item"><button type="button" data-filter="completed"><img src="./images/calendar-check.svg" alt="Completed icon">Completed</button></li>
            </ul>

            <div class="side-bar-projects">
                <h3>Projects</h3>
                <div class="projects-container"></div>
                <button type="button" id="new-project-btn">New Project +</button>
                
            </div>
        </nav>

        <main>
            <div id="task-header">
                <h2>All Tasks</h2>
            </div>
            
            <div class="add-task-container">
                <button type="button" id="task-btn">Add Task +</button>
            </div>

            <dialog class="add-task-box modal-box">
                <h3>New Task</h3>
                <form method="dialog">
                    <div class="form-field">
                        <label for="title-box">Title:</label>
                        <input type="text" name="title" id="title-box" required>
                    </div>

                    <div class="form-field">
                        <label for="description-box">Description:</label>
                        <textarea name="description" id="description-box" rows="5" cols="10" placeholder="Description of the task..."></textarea>
                    </div>

                    <div class="form-field">
                        <label for="date-box">Due date:</label>
                        <input type="date" name="date" id="date-box" required>
                    </div>

                    <fieldset>
                        <legend>Priority</legend>
                        <div class="radio-wrap">
                            <input type="radio" name="priority" id="high-prio" value="high" required>
                            <label for="high-prio">High priority</label>
                        </div>
                        <div class="radio-wrap">
                            <input type="radio" name="priority" id="medium-prio" value="medium" checked required>
                            <label for="medium-prio">Medium priority</label>
                        </div>
                        <div class="radio-wrap">
                            <input type="radio" name="priority" id="low-prio" value="low" required>
                            <label for="low-prio">Low priority</label>
                        </div>
                    </fieldset>

                    <div class="project-field">
                        <div class="form-field">
                            <label for="project-select">Project:</label>
                            <select name="projectName" id="project-select" required>
                                <option value="">--Please choose a project</option>
                                <option value="Project 33">Project 33</option>
                            </select>
                        </div>
                    </div>

                    <div class="action-buttons-wrapper">
                        <button type="submit" value="add" name="action">Add Task</button>
                        <button type="submit" value="cancel" formnovalidate name="action">Cancel</button>
                    </div>

                </form>
            </dialog>

            <dialog class="add-project-box modal-box">
                <h3>New Project</h3>
                <form method="dialog">
                    <div class="form-field">
                        <label for="project-title">Project title:</label>
                        <input type="text" name="project-title" id="project-title" required>
                    </div>

                    <div class="action-buttons-wrapper">
                        <button type="submit" value="add" name="action">Add Project</button>
                        <button type="submit" value="cancel" formnovalidate name="action">Cancel</button>
                    </div>
                </form>
            </dialog>

            <ul class="task-list" id="task-list"></ul>
        </main>
    </div>
</body>
</html>
